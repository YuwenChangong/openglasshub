normalization_rules:
- Use exact string "Not disclosed" when the feature/field could exist but no sufficiently reliable public value was found.
- Use exact string "Not applicable" only when the field is inherently inapplicable to the product (for example display fields
  on Ray-Ban Meta Gen 2, camera fields on Even Realities G1).
- Use explicit "No" when a relevant capability is known to be absent; do not convert known No into Not applicable.
- When official sources conflict, select the most current and most direct authoritative source for the primary value, and
  keep the alternative in evidence.conflicts.
- Never compare eye/perceived brightness against panel/projector brightness. They are separate fields and measurement contexts.
- Keep native tracking separate from accessory-enabled tracking.
- Do not infer compatibility from USB-C alone; where relevant, retain requirements such as DisplayPort Alt Mode or an adapter/accessory.
- Do not silently promote medium-confidence secondary values to Official. Preserve evidence.overall_confidence and notes.
